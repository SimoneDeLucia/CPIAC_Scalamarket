apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: cpiac_order:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          env:
            - name: DATABASE_URI
              value: "postgresql://admin:password@postgres-service:5432/order_db"
