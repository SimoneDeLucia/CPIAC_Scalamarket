apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: cpiac_auth:v5
          imagePullPolicy: IfNotPresent  # Assumes local image for Minikube/Docker Desktop
          ports:
            - containerPort: 5001
          env:
            - name: DATABASE_URI
              value: "postgresql://admin:password@postgres-service:5432/auth_db"
