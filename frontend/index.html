<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalamarket | Portale Logistica</title>
    <meta name="description" content="Portale di logistica per la catena Scalamarket.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="landing-container">
        <header class="landing-header">
            <h1 class="logo">Scala<span>market</span></h1>
            <p class="subtitle">Cloud Logistics Platform</p>
        </header>

        <main class="role-selection">
            <a href="client.html" class="role-card">
                <div class="role-icon">🛍️</div>
                <h2>Area Clienti</h2>
                <p>Accedi al catalogo, effettua ordini e traccia le tue spedizioni in tempo reale.</p>
                <span class="btn primary-btn">Accedi come Cliente</span>
            </a>
            
            <a href="admin.html" class="role-card admin-card">
                <div class="role-icon">🛡️</div>
                <h2>Area Amministratori</h2>
                <p>Gestisci l'inventario, monitora la logistica e ottimizza il routing degli ordini.</p>
                <span class="btn secondary-btn">Accedi come Admin</span>
            </a>
        </main>
    </div>
</body>
</html>
